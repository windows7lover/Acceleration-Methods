name: Generate PDF

on:
  push:
    branches:
      - gh-pages

permissions:
  contents: write

concurrency:
  group: generate-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pin the runner so the available system Python and apt packages stay stable.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update cache_buster in _config.yml
        run: |
          chmod +x update_version.sh
          ./update_version.sh

      # ubuntu-24.04 already includes Python 3, so no setup-python step is needed.
      # Install pypandoc from apt as well, avoiding a separate pip setup/install.
      # Use the pdflatex stack only; XeTeX and the large texlive meta-package are unnecessary.
      - name: Install PDF dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            python3-pypandoc \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern

      - name: Generate PDF
        run: python3 generate_pdf.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mv -f output.pdf acceleration_monograph_erratas.pdf
          mv -f combined.md _monographtypos/combined.md

          git add \
            acceleration_monograph_erratas.pdf \
            _monographtypos/combined.md \
            _config.yml

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update generated PDF"
            git push
          fi
