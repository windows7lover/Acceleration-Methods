name: Generate PDF

on:
  push:
    branches:
      - gh-pages

permissions:
  contents: write

concurrency:
  group: generate-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update cache_buster in _config.yml
        run: |
          chmod +x update_version.sh
          ./update_version.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install LaTeX and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive \
            texlive-latex-extra \
            texlive-xetex

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pypandoc

      - name: Generate PDF
        run: python generate_pdf.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mv -f output.pdf acceleration_monograph_erratas.pdf
          mv -f combined.md _monographtypos/combined.md

          git add \
            acceleration_monograph_erratas.pdf \
            _monographtypos/combined.md \
            _config.yml

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update generated PDF"
            git push
          fi